  <title>BotSE Pilgrims Helper</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #0c0a07;
      --surface:    #131009;
      --card:       #1a1410;
      --border:     #6b4f12;
      --border-dim: rgba(107,79,18,0.3);
      --gold:       #c0901a;
      --gold-hi:    #ddb030;
      --text:       #dad0ae;
      --text-dim:   #857055;
      --novice:     #3d7a5a;
      --master:     #8a3535;
      --int-bg:     #1a3050; --int-fg: #7aaad0;
      --end-bg:     #1a3020; --end-fg: #70a870;
      --once-bg:    #4a2a08; --once-fg: #c88040;
    }

    html, body { height: 100%; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: Georgia, 'Times New Roman', serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      flex-shrink: 0;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0.7rem 0.8rem;
      gap: 0.5rem;
    }
    .hdr-left {
      width: 80px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }
    .hdr-title { flex: 1; text-align: center; }
    .hdr-right { width: 80px; flex-shrink: 0; }
    header h1 {
      font-size: 1.1rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--gold-hi);
    }
    .hdr-back {
      background: transparent;
      border: none;
      color: var(--text-dim);
      font: 0.72rem Georgia, serif;
      cursor: pointer;
      padding: 0.25rem 0.2rem;
      transition: color 0.15s;
      white-space: nowrap;
    }
    .hdr-back:hover { color: var(--text); }
    .menu-btn {
      display: none;
      background: transparent;
      border: 1px solid var(--border-dim);
      color: var(--text-dim);
      font-size: 1.1rem;
      line-height: 1;
      padding: 0.25rem 0.45rem;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
    }
    .menu-btn:hover { color: var(--text); border-color: var(--border); }

    /* ── Views ── */
    .view { flex: 1; display: flex; overflow: hidden; }

    /* ── Home view ── */
    #homeView { align-items: center; justify-content: center; flex-direction: column; gap: 3rem; }
    .home-label {
      font-size: 0.65rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--text-dim);
    }
    .home-buttons { display: flex; flex-direction: column; align-items: center; gap: 1rem; }
    .home-btn {
      width: 220px;
      padding: 1rem 1.5rem;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-dim);
      font: 0.85rem Georgia, serif;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s;
    }
    .home-btn:hover { border-color: var(--gold); color: var(--gold-hi); background: rgba(200,150,30,0.06); }
    .home-btn.primary {
      border-color: var(--gold);
      color: var(--gold-hi);
      font-size: 1rem;
      letter-spacing: 0.3em;
      padding: 1.2rem 1.5rem;
    }
    .home-btn.primary:hover { background: rgba(200,150,30,0.1); }

    /* ── Browse view ── */
    #browseView { flex-direction: row; }

    /* ── Sidebar ── */
    nav {
      width: 172px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      background: var(--surface);
      border-right: 1px solid var(--border);
      overflow: hidden;
    }

    /* ── Backdrop (mobile) ── */
    .backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 99;
    }
    .backdrop.on { display: block; }

    /* ── Mobile layout ── */
    @media (max-width: 640px) {
      .menu-btn { display: block; }
      nav {
        position: fixed;
        top: 0; left: 0; bottom: 0;
        width: 240px;
        z-index: 100;
        transform: translateX(-100%);
        transition: transform 0.25s ease;
      }
      nav.open { transform: translateX(0); }
    }

    /* ── Wayfarer view ── */
    #wayfarerView { flex-direction: column; }
    .wayfarer-main {
      flex: 1;
      overflow-y: auto;
      padding: 1.4rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.9rem;
    }
    .wayfarer-main::-webkit-scrollbar { width: 4px; }
    .wayfarer-main::-webkit-scrollbar-thumb { background: var(--border); }
    .draw-again-btn {
      background: transparent;
      border: 1px solid var(--border-dim);
      color: var(--text-dim);
      padding: 0.45rem 1.5rem;
      font: 0.7rem Georgia, serif;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.18s;
    }
    .draw-again-btn:hover { border-color: var(--border); color: var(--text); }

    .class-list { list-style: none; overflow-y: auto; flex: 1; }
    .class-list::-webkit-scrollbar { width: 3px; }
    .class-list::-webkit-scrollbar-thumb { background: var(--border); }

    .class-list li {
      padding: 0.48rem 0.75rem;
      font-size: 0.79rem;
      letter-spacing: 0.04em;
      cursor: pointer;
      border-left: 3px solid transparent;
      color: var(--text-dim);
      transition: all 0.14s;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .class-list li:hover { color: var(--text); background: rgba(200,150,30,0.05); }
    .class-list li.sel  { color: var(--gold-hi); border-left-color: var(--gold); background: rgba(200,150,30,0.08); }
    /* ── Main ── */
    main {
      flex: 1;
      overflow-y: auto;
      padding: 1.4rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.9rem;
    }
    main::-webkit-scrollbar { width: 4px; }
    main::-webkit-scrollbar-thumb { background: var(--border); }

    /* ── Card ── */
    .card {
      width: 100%;
      max-width: 570px;
      background: var(--card);
      border: 1px solid var(--border);
      box-shadow: 0 6px 30px rgba(0,0,0,0.5);
    }

    .tabs { display: flex; border-bottom: 1px solid var(--border); }
    .tier-tab {
      flex: 1;
      padding: 0.58rem;
      font: 0.63rem Georgia, serif;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      cursor: pointer;
      border: none;
      background: transparent;
      color: var(--text-dim);
      transition: color 0.14s;
      position: relative;
    }
    .tier-tab::after {
      content: '';
      position: absolute;
      bottom: -1px; left: 0; right: 0;
      height: 2px;
      background: transparent;
      transition: background 0.14s;
    }
    .tier-tab:hover { color: var(--text); }
    .tier-tab.nov { color: var(--novice); }
    .tier-tab.nov::after { background: var(--novice); }
    .tier-tab.mst { color: var(--master); }
    .tier-tab.mst::after { background: var(--master); }

    /* Card body */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .card-body {
      padding: 1.2rem 1.35rem 1.4rem;
      animation: fadeIn 0.22s ease;
    }

    .class-heading {
      text-align: center;
      padding-bottom: 0.85rem;
      margin-bottom: 0.95rem;
      border-bottom: 1px solid var(--border-dim);
    }
    .class-heading h2 {
      font-size: clamp(1.3rem, 6.5vw, 1.9rem);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--gold-hi);
    }
    .class-heading .const-icon { margin-left: 0.4em; vertical-align: middle; }

    .upgrade {
      display: flex;
      gap: 0.55rem;
      border: 1px solid var(--novice);
      padding: 0.5rem 0.7rem;
      margin-bottom: 0.85rem;
      align-items: flex-start;
    }
    .upg-label {
      font-size: 0.56rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--novice);
      flex-shrink: 0;
      padding-top: 2px;
    }
    .upgrade p { font-size: 0.77rem; line-height: 1.5; color: var(--text-dim); }

    .passive {
      background: rgba(200,150,30,0.04);
      border-left: 2px solid var(--gold);
      padding: 0.58rem 0.82rem;
      margin-bottom: 1rem;
      font-size: 0.81rem;
      line-height: 1.55;
      color: var(--text);
    }

    .skills-hdr {
      font-size: 0.58rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--text-dim);
      padding-bottom: 0.38rem;
      margin-bottom: 0.45rem;
      border-bottom: 1px solid var(--border-dim);
    }

    .skill {
      display: flex;
      gap: 0.72rem;
      padding: 0.58rem 0;
      border-bottom: 1px solid var(--border-dim);
      align-items: flex-start;
    }
    .skill:last-child { border-bottom: none; }

    .cost {
      width: 24px; height: 24px;
      border-radius: 50%;
      background: var(--border);
      color: var(--bg);
      display: flex; align-items: center; justify-content: center;
      font: bold 0.72rem Arial, sans-serif;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .skill-info { flex: 1; }
    .skill-head {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 0.32rem;
      margin-bottom: 0.18rem;
    }
    .skill-name { font-size: 0.87rem; color: var(--gold-hi); }

    .tag {
      font-size: 0.56rem;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      padding: 0.07rem 0.33rem;
      border-radius: 2px;
    }
    .t-i { background: var(--int-bg); color: var(--int-fg); }
    .t-e { background: var(--end-bg); color: var(--end-fg); }
    .t-o { background: var(--once-bg); color: var(--once-fg); }

    .skill-desc { font-size: 0.78rem; line-height: 1.55; color: var(--text-dim); }

    /* ── Inline icons ── */
    .ico {
      height: 1.1em;
      width: auto;
      vertical-align: text-bottom;
      display: inline-block;
    }
    /* Fallback badge shown when no image is provided yet */
    .ico-badge {
      display: inline-block;
      font-size: 0.62em;
      font-family: Arial, sans-serif;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 0.1em 0.38em;
      border: 1px solid var(--border-dim);
      border-radius: 2px;
      color: var(--text-dim);
      vertical-align: middle;
    }
  </style>
</head>
<body>

<header>
  <div class="hdr-left">
    <button class="hdr-back" id="backBtn" onclick="goHome()" style="display:none">&#8592; Home</button>
    <button class="menu-btn" id="menuBtn" onclick="toggleNav()" aria-label="Menu">&#9776;</button>
  </div>
  <div class="hdr-title"><h1>BotSE Pilgrims Helper</h1></div>
  <div class="hdr-right"></div>
</header>

<div class="backdrop" id="backdrop" onclick="closeNav()"></div>

<!-- Home view -->
<div id="homeView" class="view">
  <div class="home-buttons">
    <button class="home-btn primary" onclick="goWayfarer()">Wayfarer</button>
    <button class="home-btn" onclick="goBrowse()">Browse</button>
  </div>
</div>

<!-- Browse view -->
<div id="browseView" class="view" style="display:none">
  <nav id="nav">
    <ul class="class-list" id="classList"></ul>
  </nav>
  <main>
    <div class="card">
      <div class="tabs" id="tabs">
        <button class="tier-tab nov" onclick="setTier('novice')">Novice</button>
        <button class="tier-tab" onclick="setTier('master')">Master</button>
      </div>
      <div class="card-body" id="cardBody"></div>
    </div>
  </main>
</div>

<!-- Wayfarer view -->
<div id="wayfarerView" class="view" style="display:none">
  <div class="wayfarer-main">
    <div class="card" style="width:100%;max-width:570px">
      <div class="tabs" id="wayfarerTabs">
        <button class="tier-tab nov" onclick="setWayfarerTier('novice')">Novice</button>
        <button class="tier-tab" onclick="setWayfarerTier('master')">Master</button>
      </div>
      <div class="card-body" id="wayfarerBody"></div>
    </div>
    <button class="draw-again-btn" onclick="goWayfarer()">Draw Again</button>
  </div>
</div>

// Replaces {{key}} tokens with <img> tags (or text badges if no image set)
function iconify(text) {
  return text.replace(/\{\{(\w+)\}\}/g, (_, key) => {
    const src = ICONS[key];
    if (src) return `<img class="ico" src="${src}" alt="${key}" title="${key}">`;
    const label = key.charAt(0).toUpperCase() + key.slice(1);
    return `<span class="ico-badge">${label}</span>`;
  });
}

// ── State ──
let appView = 'home';     // 'home' | 'browse' | 'wayfarer'
let activeIdx = 0;
let tier = 'novice';
let wayfarerIdx = -1;
let wayfarerTier = 'master';

// ── Helpers ──
function buildSkillHTML(s) {
  const formIcon = s.form ? s.form.map(k => iconify(`{{${k}}}`)).join('') : '';
  let tags = '';
  if (s.i) tags += `<span class="tag t-i">Interrupt</span>`;
  if (s.e) tags += `<span class="tag t-e">Enduring</span>`;
  if (s.o) tags += `<span class="tag t-o">Once per Battle</span>`;
  return `<div class="skill">
    <div class="cost">${s.cost}</div>
    <div class="skill-info">
      <div class="skill-head"><span class="skill-name">${s.name}</span>${formIcon}${tags}</div>
      <div class="skill-desc">${iconify(s.desc)}</div>
    </div>
  </div>`;
}

// ── Nav drawer (mobile) ──
function toggleNav() {
  const nav = document.getElementById('nav');
  const bd  = document.getElementById('backdrop');
  const open = nav.classList.toggle('open');
  bd.classList.toggle('on', open);
}
function closeNav() {
  const nav = document.getElementById('nav');
  if (nav) nav.classList.remove('open');
  document.getElementById('backdrop').classList.remove('on');
}

// ── View navigation ──
function goHome() {
  closeNav();
  appView = 'home';
  renderHeader();
  renderViews();
}
function goBrowse() {
  appView = 'browse';
  renderHeader();
  renderViews();
  render();
}
function goWayfarer() {
  const pilgrimIdx = C.findIndex(c => c.name === 'Pilgrim');
  const eligible = C.map((_, i) => i).filter(i => i !== pilgrimIdx);
  wayfarerIdx = eligible[Math.floor(Math.random() * eligible.length)];
  wayfarerTier = 'master';
  appView = 'wayfarer';
  renderHeader();
  renderViews();
  renderWayfarerTabs();
  renderWayfarer();
}

function renderHeader() {
  const isHome = appView === 'home';
  const isBrowse = appView === 'browse';
  document.getElementById('backBtn').style.display = isHome ? 'none' : '';
  document.getElementById('menuBtn').style.display  = isBrowse ? '' : 'none';
}

function renderViews() {
  document.getElementById('homeView').style.display     = appView === 'home'     ? '' : 'none';
  document.getElementById('browseView').style.display   = appView === 'browse'   ? '' : 'none';
  document.getElementById('wayfarerView').style.display = appView === 'wayfarer' ? '' : 'none';
}

// ── Browse actions ──
function selectClass(idx) {
  activeIdx = idx;
  closeNav();
  render();
}
function setTier(t) { tier = t; renderTabs(); renderCard(); }

// ── Browse render ──
function renderSidebar() {
  document.getElementById('classList').innerHTML = C.map((c, i) => {
    return `<li class="${i === activeIdx ? 'sel' : ''}" onclick="selectClass(${i})">${c.name}</li>`;
  }).join('');
}

function renderTabs() {
  const [nov, mst] = document.getElementById('tabs').children;
  nov.className = 'tier-tab' + (tier === 'novice' ? ' nov' : '');
  mst.className = 'tier-tab' + (tier === 'master' ? ' mst' : '');
}

function renderCard() {
  const cls = C[activeIdx];
  const d = cls[tier];
  const body = document.getElementById('cardBody');

  const constIcon = cls.constellation ? `<span class="const-icon">${iconify(`{{${cls.constellation}}}`)}</span>` : '';
  let h = `<div class="class-heading"><h2>${cls.name}${constIcon}</h2></div>`;
  if (tier === 'novice' && d.upgrade) {
    h += `<div class="upgrade">
      <span class="upg-label">Upgrade</span>
      <p>${iconify(d.upgrade)}</p>
    </div>`;
  }
  h += `<div class="passive">${iconify(d.passive)}</div>`;
  h += `<div class="skills-hdr">Skills</div>`;
  h += d.skills.map(buildSkillHTML).join('');

  body.style.animation = 'none';
  body.innerHTML = h;
  requestAnimationFrame(() => { body.style.animation = ''; });
}

function render() { renderSidebar(); renderTabs(); renderCard(); }

// ── Wayfarer render ──
function setWayfarerTier(t) {
  wayfarerTier = t;
  renderWayfarerTabs();
  renderWayfarer();
}

function renderWayfarerTabs() {
  const [nov, mst] = document.getElementById('wayfarerTabs').children;
  nov.className = 'tier-tab' + (wayfarerTier === 'novice' ? ' nov' : '');
  mst.className = 'tier-tab' + (wayfarerTier === 'master' ? ' mst' : '');
}

function renderWayfarer() {
  const cls = C[wayfarerIdx];
  const d = cls[wayfarerTier];
  const eligible = d.skills.filter(s => !s.i && !s.e);
  const body = document.getElementById('wayfarerBody');

  const constIcon = cls.constellation ? `<span class="const-icon">${iconify(`{{${cls.constellation}}}`)}</span>` : '';
  let h = `<div class="class-heading"><h2>${cls.name}${constIcon}</h2></div>`;
  h += `<div class="skills-hdr">Available Skills</div>`;
  if (eligible.length === 0) {
    h += `<p style="padding:1rem;color:var(--text-dim);font-size:0.82rem">No triggerable skills on this side.</p>`;
  } else {
    h += eligible.map(buildSkillHTML).join('');
  }

  body.style.animation = 'none';
  body.innerHTML = h;
  requestAnimationFrame(() => { body.style.animation = ''; });
}

// ── Init ──
renderHeader();
renderViews();
</script>
